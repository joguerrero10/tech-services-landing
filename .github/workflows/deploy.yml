name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Angular application
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------
      # Checkout
      # ---------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------
      # Node.js
      #
      # package.json requires:
      # node >=24.15.0 <25
      # ---------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # ---------------------------------------------
      # Install dependencies
      # ---------------------------------------------
      - name: Install dependencies
        run: npm ci

      # ---------------------------------------------
      # Build specifically for GitHub Pages
      #
      # package.json already contains:
      #
      # build:pages:
      # ng build --base-href /tech-services-landing/
      # && SEO_ENV=production node scripts/generate-seo.mjs
      # ---------------------------------------------
      - name: Build for GitHub Pages
        run: npm run build:pages

      # ---------------------------------------------
      # Verify generated Angular files
      # ---------------------------------------------
      - name: Verify Angular prerender output
        run: |
          echo "Generated files:"
          find dist/tech-services-landing/browser -maxdepth 2 -type f | sort

          echo ""
          echo "Checking required files..."

          test -f dist/tech-services-landing/browser/index.html
          test -f dist/tech-services-landing/browser/es/index.html
          test -f dist/tech-services-landing/browser/en/index.html

          echo ""
          echo "Spanish route:"
          ls -lh dist/tech-services-landing/browser/es/index.html

          echo ""
          echo "English route:"
          ls -lh dist/tech-services-landing/browser/en/index.html

      # ---------------------------------------------
      # Configure GitHub Pages
      # ---------------------------------------------
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      # ---------------------------------------------
      # Upload static Angular application
      # ---------------------------------------------
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/tech-services-landing/browser

  deploy:
    name: Deploy to GitHub Pages
    needs: build

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # ---------------------------------------------
      # Deploy
      # ---------------------------------------------
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
