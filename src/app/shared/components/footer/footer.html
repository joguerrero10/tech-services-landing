<footer class="page-container footer">
  <div>
    <a class="footer-brand" [routerLink]="[]" fragment="inicio">{{
      'identity.name' | translate
    }}</a>
    <p>{{ 'footer.tagline' | translate }}</p>
  </div>
  <nav
    class="flex flex-wrap gap-6"
    [attr.aria-label]="'accessibility.footerNavigation' | translate"
  >
    @for (item of navigation; track item.fragment) {
      <a [routerLink]="[]" [fragment]="item.fragment">{{ item.label | translate }}</a>
    }
  </nav>
</footer>
