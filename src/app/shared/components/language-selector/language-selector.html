<select
  #languageSelect
  [attr.aria-label]="'language.label' | translate"
  [value]="language.language()"
  [disabled]="language.changing()"
  (change)="selectLanguage(languageSelect)"
>
  @for (locale of locales; track locale.value) {
    <option
      [value]="locale.value"
      [attr.lang]="locale.value"
      [selected]="locale.value === language.language()"
      [attr.selected]="locale.value === language.language() ? '' : null"
    >
      {{ locale.label | translate }}
    </option>
  }
</select>

@if (language.error(); as error) {
  <p class="language-error" role="status">{{ error | translate }}</p>
}
