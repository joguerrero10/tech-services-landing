<div class="loader-shell" (keydown.escape)="skip()">
  <div class="loader-top">
    <p class="loader-identity">
      <app-icon name="tt-mark" aria-hidden="true" />{{ 'identity.name' | translate }}
    </p>
    <button class="loader-skip" type="button" (click)="skip()">
      {{ 'accessibility.skipStartup' | translate }}<span aria-hidden="true">↗</span>
    </button>
  </div>

  <div class="loader-stage">
    <svg class="loader-art" viewBox="0 0 360 360" fill="none" aria-hidden="true" focusable="false">
      <circle class="orbit-guide" cx="180" cy="180" r="164" />
      <circle class="orbit-guide" cx="180" cy="180" r="132" />
      <g class="orbit orbit-outer">
        <circle class="orbit-segment" cx="180" cy="180" r="164" stroke-dasharray="120 395" />
        <circle class="orbit-node" cx="180" cy="16" r="4" />
        <circle class="orbit-node" cx="180" cy="344" r="4" />
      </g>
      <g class="orbit orbit-inner">
        <circle class="orbit-accent" cx="180" cy="180" r="132" stroke-dasharray="68 346" />
        <circle class="orbit-spark" cx="48" cy="180" r="3" />
        <circle class="orbit-spark" cx="312" cy="180" r="3" />
      </g>
      <rect class="core-halo" x="85" y="85" width="190" height="190" rx="62" />
      <rect class="core-frame" x="99" y="99" width="162" height="162" rx="50" pathLength="1" />
      <g class="code-glyph" stroke-linecap="round" stroke-linejoin="round">
        <path class="code-left" d="M150 152 L122 180 L150 208" pathLength="1" />
        <path class="code-slash" d="M191 145 L169 215" pathLength="1" />
        <path class="code-right" d="M210 152 L238 180 L210 208" pathLength="1" />
      </g>
      <path class="art-cross" d="M59 59 V71 M53 65 H65 M300 288 V300 M294 294 H306" />
    </svg>
    <div class="loader-copy">
      <p class="loader-title">{{ 'identity.startupTitle' | translate }}</p>
      <p class="loader-message" role="status" aria-live="polite">
        {{ 'accessibility.startup' | translate }}
      </p>
    </div>
    <div class="loader-track" aria-hidden="true"><span></span></div>
  </div>

  <div class="loader-bottom">
    <span class="loader-dot" aria-hidden="true"></span>
    <p>{{ 'footer.tagline' | translate }}</p>
  </div>
</div>
