<div class="page-container loader-shell" role="status" aria-live="polite" aria-atomic="true">
  <div class="loader-mark" aria-hidden="true"><app-icon name="code-xml" /></div>
  <div class="loader-copy">
    <p class="loader-identity">{{ 'identity.name' | translate }}</p>
    <p class="loader-message">{{ 'accessibility.startup' | translate }}</p>
  </div>
  <div class="loader-dots" aria-hidden="true"><span></span><span></span><span></span></div>
</div>
