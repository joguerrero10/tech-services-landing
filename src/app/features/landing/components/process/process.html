<section id="proceso" class="page-container section" tabindex="-1" aria-labelledby="process-title">
  <div class="section-heading">
    <h2 id="process-title">{{ 'process.title' | translate }}</h2>
  </div>
  <ol class="process-grid">
    @for (item of items; track item.id) {
      <li class="flex items-start gap-5">
        <span class="step-number" aria-hidden="true">{{ item.number | translate }}</span>
        <div>
          <h3>{{ item.title | translate }}</h3>
          <p>{{ item.description | translate }}</p>
        </div>
      </li>
    }
  </ol>
</section>
